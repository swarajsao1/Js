
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Visualization</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <h1>Interactive Sine Wave</h1>

  <label>
    Amplitude:
    <input id="amp" type="range" min="0.2"
           max="3" step="0.1" value="1">
    <span id="ampValue">1</span>
  </label>

  <label>
    Frequency:
    <input id="freq" type="range" min="1"
           max="8" step="0.5" value="2">
    <span id="freqValue">2</span>
  </label>

  <canvas id="plot" width="850" height="400"></canvas>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
    <main>
        <h1>Calculator</h1>
        <div class="conatiner">
            <div class="disp" id="disp">0</div>
            
            <div class="keypad">
            <div class="utilsNums">
            <section class="utils">
                <button id="clearButton">AC</button>
                <button id="deleteButton">Del</button>
                <button >%</button>
            </section>    
    
            <section class="nums">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+/-</button>
                <button>0</button>
                <button>.</button>
            </section>
            </div>
            <section class="operators">
                <button data-operators="/">÷</button>
                <button data-operators="*">*</button>
                <button data-operators="+">+</button>
                <button data-operators="-">-</button>
                <button id="equalButton">=</button>
            </section>    
            </div>
        </div>
    </main>
    <footer></footer>
    </body>
</html>

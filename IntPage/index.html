<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Interactive Webpage</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main>
            <h1>Interactive Webpage</h1>
            <p id="message">Click the button below.</p>
            <button id="changeButton">Click me</button>

            <div class="container">
            <h2>Interactive Counter</h2>
            <p>Click recorded <span id="counter" class="counter">0</span></p>
            <section class="containerButton">
            <button id="countButton" class="button">Count +1</button>
            <button id="resetButton" class="button">Reset</button>
            </section>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
